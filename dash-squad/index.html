<title>Dash Squad</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#101624;color:#eef;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;touch-action:pan-y}
.panel{width:100%;max-width:440px;max-height:100%;overflow:auto;background:rgba(16,22,40,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
h1{margin:.1em 0 .1em;text-align:center;font-size:2.2rem;letter-spacing:.5px;font-weight:900;color:#fff;text-shadow:0 3px 0 #ff5a5f,0 6px 0 rgba(0,0,0,.25)}
h1 i{font-style:normal;color:#ffd23f}
h2{margin:.5em 0;font-size:1.15rem}
.sub{text-align:center;color:#aab4d0;margin:0 0 10px}
label{display:block;font-size:.85rem;color:#aab4d0;margin:8px 0 4px}
input{width:100%;font:inherit;font-size:18px;color:#fff;background:#232c46;border:2px solid #34405f;border-radius:10px;padding:10px 12px;min-height:48px;-webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:#ffd23f}
button{display:block;width:100%;min-height:50px;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:12px;padding:10px;margin:10px 0 0;background:#ffd23f;color:#1b1b1b;cursor:pointer;touch-action:manipulation}
button.alt{background:#3a4668;color:#fff}
button.ghost{background:transparent;color:#aab4d0;border:2px solid #34405f}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.code{font:900 2.8rem/1.1 ui-monospace,Menlo,monospace;letter-spacing:.3em;text-align:center;color:#ffd23f;margin:4px 0}
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #2a3452;min-height:46px}
.plist li:last-child{border:0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tag{font-size:.72rem;background:#34405f;border-radius:6px;padding:2px 7px;color:#cfd6ee}
.small{font-size:.85rem;color:#aab4d0}.center{text-align:center}
.err-box{background:#5a1a22;color:#ffd0d6;padding:10px 12px;border-radius:10px;margin:8px 0}
#status{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:20;font-size:.9rem;padding:7px 14px;border-radius:0 0 12px 12px;display:none;max-width:92%;text-align:center}
#status.show{display:block}#status.warn{background:#6b4d0f;color:#ffe7a8}#status.err{background:#6b1a22;color:#ffd0d6}#status.ok{background:#1d4a33;color:#c0f5d2}

.chip{background:rgba(10,14,28,.62);border-radius:12px;padding:5px 11px;font-weight:800;font-size:15px;display:inline-flex;gap:12px;align-items:center;color:#fff;text-shadow:0 1px 2px #000}
#plist{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#plist .chip{font-size:13px;gap:6px;padding:4px 9px}
#banner{position:fixed;left:0;right:0;top:22%;text-align:center;font-weight:900;font-size:clamp(26px,7vw,54px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .3s;z-index:6}
#banner.show{opacity:1}
#msg{position:fixed;left:0;right:0;top:62px;text-align:center;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none;z-index:6}
#touch{position:fixed;left:0;right:0;bottom:0;height:0;z-index:8;display:none}
.tb{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;text-shadow:0 2px 3px rgba(0,0,0,.5)}

.big{font-size:2.6rem;font-weight:900;text-align:center;color:#ffd23f;margin:4px 0}

    <label for="code" style="margin-top:14px">Have a code?</label><div class="row"><input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.3em;font-weight:800" value="${esc(room)}"><button id="join" class="alt" data-act="join" style="margin:0;flex:0 0 38%">Join</button></div>
    <p class="small center" style="margin-top:12px">Keys: &larr; &rarr; / A D run \u00b7 Space / &uarr; jump · F / X / Shift &#9889; zap. Phones get touch buttons.</p></div></div>`;
  else if (view === 'connect') html = `<div class="ov"><div class="panel center"><h1>Dash <i>Squad</i></h1><p>Connecting to room <b>${esc(sess.code)}</b>\u2026</p><button class="ghost" data-act="leave">Cancel</button></div></div>`;
  else if (view === 'lobby') {
    const n = W.players.length;
    html = `<div class="ov"><div class="panel two"><h1>Dash <i>Squad</i></h1><div><div class="center small">Room code</div><div class="code" id="roomcode">${esc(W.code)}</div>
      <div class="row">${navigator.share ? '<button data-act="share">Share invite</button><button class="alt" data-act="copy">Copy link</button>' : '<button data-act="copy">Copy invite link</button>'}</div>
      <input class="invite" id="invite" readonly value="${esc(inviteLink())}" aria-label="Invite link">
      <div class="small" style="margin-top:10px">${H ? 'Start at level' : 'Starting level'}</div><div class="row lv" id="lvpick">${LEVELS.map((l, i) => `<button class="${i === (W.startLvl || 0) ? '' : 'alt'}" ${H ? `data-act="lvl" data-l="${i}"` : 'disabled'}>${i + 1}. ${esc(l.name)}</button>`).join('')}</div>
      </div>
      <div><h2 id="pcount">Squad (${n}/${MAX_PLAYERS})</h2><ul class="plist">${W.players.map(playerRow).join('')}</ul>
      ${H ? `<button id="start" data-act="start">Start ${esc(LEVELS[W.startLvl || 0].name)}${n === 1 ? ' (solo)' : ''}</button>` : '<div class="center small" id="waiting" style="padding:12px">Waiting for host to start\u2026</div>'}
      <button class="ghost" data-act="leave">Leave room</button></div></div></div>`;
  } else if (view === 'clear' && W.clear) {
    const c = W.clear, left = Math.max(0, Math.ceil((c.at - W.ts - (Date.now() - (W.recvWall || W.ts))) / 1000));
    html = `<div class="ov"><div class="panel two" id="clearcard"><h1>Level <i>Clear!</i></h1><div><p class="sub">${c.lvl + 1}. ${esc(c.name)} \u00b7 ${esc(c.why)}</p>
      <div class="big" id="lscore">+${c.score}</div><div class="center small">level score \u00b7 time <b>${fmtTime(c.t)}</b> \u00b7 team total <b id="ctotal">${c.total}</b></div>
      <p class="center small">&#10084;&#65039; +1 life for clearing \u00b7 lives now ${Math.min(MAX_LIVES, W.lives + 1)}</p></div><div>
      <table class="res"><tr class="small"><th></th><th style="text-align:left">Player</th><th>&#129689;</th><th>&#128094;</th><th>&#9889;</th><th>&#127937;</th></tr>
      ${c.rows.map(x => `<tr><td><span class="dot" style="display:inline-block;background:${COLORS[x.slot]}"></span></td><td style="text-align:left">${esc(x.name)}</td><td>${x.c}</td><td>${x.s}</td><td>${x.z}</td><td>${x.fin ? '&#127937;' : '\u2013'}</td></tr>`).join('')}</table>
      <p class="center" id="nextlvl" style="font-weight:800">Next: ${esc(LEVELS[c.next].name)} in <span id="clearleft">${left}</span>\u2026</p></div></div></div>`;
  } else if (view === 'results' && W.result) {
    const r = W.result;
    html = `<div class="ov"><div class="panel two" id="results"><h1>${r.all ? 'Squad <i>Victory!</i>' : r.ok ? 'Run <i>Complete</i>' : 'Game <i>Over</i>'}</h1><div><p class="sub">${esc(r.why)}</p>
      <div class="big" id="total">${r.total}</div><div class="center small">team score \u00b7 time <b id="rtime">${fmtTime(r.t)}</b> \u00b7 lives left ${W.lives}</div>
      <table class="res" id="ltable"><tr class="small"><th style="text-align:left">Level</th><th>Score</th><th>Time</th></tr>${r.levels.map(l => `<tr><td style="text-align:left">${l.i + 1}. ${esc(l.name)}${l.ok ? '' : ' &#10006;'}</td><td>${l.score}</td><td>${fmtTime(l.t)}</td></tr>`).join('')}</table>
      <p class="small center">coin ${PTS.coin} \u00b7 stomp/zap ${PTS.stomp} \u00b7 flag ${PTS.finish}</p></div><div>
      <table class="res" id="rtable"><tr class="small"><th></th><th style="text-align:left">Player</th><th>Coins</th><th>Stomps</th><th>Zaps</th><th>Falls</th><th>Flags</th></tr>
      ${r.rows.map(x => `<tr data-pid="${esc(x.id)}"><td><span class="dot" style="display:inline-block;background:${COLORS[x.slot]}"></span></td><td style="text-align:left">${esc(x.name)}</td><td class="rc">${x.c}</td><td class="rs">${x.s}</td><td class="rz">${x.z}</td><td class="rd">${x.d}</td><td class="rf">${x.f}</td></tr>`).join('')}</table>
      ${H ? '<button id="again" data-act="again">Play again (back to lobby)</button>' : '<p class="center small" id="waitagain">Waiting for host\u2026</p>'}
      <button class="ghost" data-act="leave">Leave room</button></div></div></div>`;
  }
  $('ui').innerHTML = html;
}
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('#snd')) { const k = e.target.closest('#sm') ? 'm' : 's'; AUD.set(k, !AUD.pref[k]); AUD.sfx('ui', 0.8); return; }
  if (e.target.classList && e.target.classList.contains('invite')) { e.target.focus(); e.target.setSelectionRange(0, e.target.value.length); return; }
  const b = e.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act; AUD.sfx('ui', 0.8);
  if (act === 'create' || act === 'join') {
    const n = ($('name').value || '').trim().slice(0, 14); if (!n) { ui.err = 'Please enter your name first.'; return renderUI(true); }
    me.name = n; save('ds_me', me);
    if (act === 'create') return hostCreate();
    const c = ($('code').value || '').trim().toUpperCase().replace(/[^A-Z]/g, ''); if (c.length !== 4) { ui.err = 'Room codes are 4 letters.'; return renderUI(true); }
    return enterRoom(c, false);
  }
  if (act === 'leave') return leave();
  if (act === 'copy') return copyText(inviteLink());
  if (act === 'share') { const l = inviteLink(); if (navigator.share) navigator.share({ title: 'Dash Squad', text: 'Join my Dash Squad room ' + W.code, url: l }).catch(e => { if (!e || e.name !== 'AbortError') manualCopy(l); }); else copyText(l); return; }
  if (act === 'start') return hostStart();
  if (act === 'lvl') return hostPickLevel(+b.dataset.l);
  if (act === 'again') return hostToLobby();
});

/* ================= MAIN LOOP ================= */
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const lobbySnap = a => W && W.phase === 'clear' && LV.flag ? { x: LV.flag.x - 4.5 + a.slot * 1.4, y: LV.flag.y, vx: 0, vy: 0, face: 1, anim: 5, alive: true } : { x: (LV.cps[0] ? LV.cps[0].x : 3) + 2 + a.slot * 1.5, y: LV.cps[0] ? LV.cps[0].y : 0, vx: 0, vy: 0, face: 1, anim: W && W.phase === 'results' ? 5 : 0, alive: true };
let lastT = now(), fpsAcc = 0, fpsN = 0;
function frame() {
  requestAnimationFrame(frame);
  const tn = now(), dt = Math.min(0.1, (tn - lastT) / 1000); lastT = tn;
  if (clockOff != null && clockTarget != null) clockOff += clamp(clockTarget - clockOff, -dt * 120, dt * 120); // slew <=12%: no enemy pops after stalls
  fpsAcc += dt; fpsN++; if (fpsAcc >= 1) { game.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  const playing = game.playing && W && W.phase === 'play';
  if (playing) {
    updateLocal(dt);
    if (tn - game.lastPosSave > 1000 && game.L && game.L.alive) { game.lastPosSave = tn; save('ds_pos', { gid: W.gid, code: W.code, x: game.L.x, y: game.L.y, dj: game.L.hasDJ }); }
  }
  for (const id in game.avatars) {
    const a = game.avatars[id]; let s;
    if (!playing) s = lobbySnap(a);
    else if (id === me.id) s = localSnapshot();
    else { const r = game.remotes[id], p = W.players.find(q => q.id === id); s = r ? sampleRemote(r, dt) : null; if (!s || (p && !p.on && now() - r.last > 8000)) s = { x: 0, y: 0, alive: false }; }
    poseAvatar(a, s, dt);
    if (game.rec && id !== me.id) game.rec.push([Math.round(tn), id, +a.g.position.x.toFixed(3), +a.g.position.y.toFixed(3), a.g.visible && (!a.rig || a.rig.visible) ? 1 : 0, s.alive ? 1 : 0]);
  }
  AUD.update(); updateBolts(dt); updateWorldView(); updateParticles(dt); updateCamera(dt); updateHUD();
  renderer.render(scene, camera);
}
setInterval(() => { if (game.playing && W && W.phase === 'play') publishLocal(); }, 1000 / SEND_HZ); // own timer: steady 10 Hz even if FPS dips
setInterval(() => {
  if (H) { if (H.phase === 'clear' && H.clear && Date.now() >= H.clear.at) hostNextLevel(); else if (hostCheck()) hostChanged(); else if (Date.now() - (H.lastPub || 0) > 1000) hostPublish(); } // 1 Hz heartbeat
  else if (sess && inRoom() && Date.now() - ui.lastHi > 3000) { ui.lastHi = Date.now(); sendAction({ type: 'hi' }); }
  if (!H && ui.pending.length && Date.now() - ui.lastResend > 1000) { ui.lastResend = Date.now(); resendPending(); }
  if (sess && !H && !W && Net.up() && Date.now() - Math.max(ui.joinStart, ui.upAt || 0) > NOT_FOUND_MS) fail('Room \u201c' + sess.code + '\u201d not found. Check the code and try again.');
  updateStatus();
}, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden && sess) { Net.kick(); if (H) hostPublish(); } });
addEventListener('online', () => { if (sess) Net.kick(); });

/* ================= TEST HOOK (only used by the automated tests) ================= */
window.__test = {
  rec: on => { if (on) game.rec = []; else { const r = game.rec; game.rec = null; return r; } },
  bolts: () => bolts.map(b => ({ x: b.x, y: b.y, d: b.d, own: b.own })), throwBolt(face) { const L = game.L; if (L) { if (face) L.face = face; game.boltCd = 0; tryThrow(L, { b: true }, 0); } },
  get: () => ({ rb: game.remoteBolts || 0, lvl: LVI, lvlName: LV.name, phase: W && W.phase, me: me.id, L: game.L && { x: game.L.x, y: game.L.y, vx: game.L.vx, vy: game.L.vy, alive: game.L.alive, onGround: game.L.onGround, hasDJ: game.L.hasDJ }, finished: game.finished, localStomp0: !!game.localStomp[0], W, fps: game.fps, net: netStats, log: LOG.slice(-40),
    remotes: Object.fromEntries(Object.entries(game.remotes).map(([k, r]) => [k, r.cur && { x: r.cur.x, y: r.cur.y, alive: r.cur.alive, age: Math.round(now() - r.last) }])) }),
  input(o) { Object.assign(testInput, o, { on: true }); }, release() { Object.assign(testInput, { l: false, r: false, j: false, b: false, on: false }); },
  av: () => Object.entries(game.avatars).map(([id, a]) => ({ id, g: a.g.visible, rig: a.rig.visible, x: +a.g.position.x.toFixed(2), y: +a.g.position.y.toFixed(2), sx: +a.body.scale.x.toFixed(2), sy: +a.body.scale.y.toFixed(2), inv: game.L && game.L.inv })),
  teleport(x, y, vx = 0, vy = 0) { game.noWarp = now() + 1500; game.noHurt = now() + 1200; Object.assign(game.L, { x, y, vx, vy, onGround: false }); }, // test-only grace (no blink) so warps don't land on enemies
  aud: AUD, level: LV, enemyPos: i => enemyPos(LV.enemies[i], gameTime()), gameTime, PH,
  sim(o) { // run the real physics offline in a custom mini-world, returns the trajectory
    const world = { solids: o.solids || [], slopes: o.slopes || [], end: 1e9 }, p = newBody(o.x || 0, o.y || 0); Object.assign(p, o.body || {});
    const out = []; for (let f = 0; f < o.frames; f++) { stepPlayer(p, o.input(f, p), PH.STEP, world); out.push({ f, x: p.x, y: p.y, vx: p.vx, vy: p.vy, g: p.onGround }); p.ev.length = 0; }
    return out;
  }
};

/* ================= BOOT ================= */
AUD.paint();
buildLevel(); frame();
{
  const room = (QS.get('room') || '').toUpperCase();
  if (sess && (!room || room === sess.code)) {
    const h = sess.host && load('ds_host_' + sess.code);
    if (h) { H = h; H.v += 2; H.levels = H.levels || []; H.tot = H.tot || {}; H.lvl = H.lvl || 0; H.players.forEach(p => { if (p.id !== me.id) p.seen = Date.now(); }); Net.start(onMessage); Net.subscribe(TOPIC + sess.code + '/+'); ui.joinStart = Date.now(); hostChanged(); }
    else if (sess.host) { save('ds_session', null); sess = null; ui.err = 'Your old room has ended.'; renderUI(true); }
    else enterRoom(sess.code, false);
  } else { sess = null; renderUI(true); }
}
window.__booted = true;
</script>
</body>
</html>
