<script type="module">
import * as THREE from 'three';

/* ================= CONFIG ================= */
const QS = new URLSearchParams(location.search);
const BROKERS = [ // all used at once: publish to each, de-dupe on receive. shiftr is on 443 (passes strict firewalls) so it gets 2 connections.
  { url: 'wss://public.cloud.shiftr.io/mqtt', user: 'public', pass: 'public' },
  { url: 'wss://public.cloud.shiftr.io/mqtt', user: 'public', pass: 'public' },

];
const TOPIC = 'ds1/', MAX_PLAYERS = 4, START_LIVES = 5, SEND_HZ = 10, INTERP_MS = 110;

const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ';
const COLORS = ['#ff5a5f', '#3fa9f5', '#ffc93c', '#b36bff'];

/* ================= LEVELS (data) =================

const LEVELS = [{
  name: 'Sunny Summit',
  data: [
    ['sec', 0, 'Warm-up Meadow'], ['k', 3, 0],
    ['g', -2, 26, 0], ['c', 6, 1.3, 5, 1, 0], ['b', 12, 0], ['b', 13, 0], ['b', 13, 1], ['c', 13.5, 2.6, 1, 0, 0],

    ['sec', 150, 'Critter Gauntlet'],
    ['w', 152, 160, 1], ['c', 153, 2.4, 6, 1.2, 0], ['j', 165, 1], ['w', 162, 171, 1],
    ['b', 172, 1], ['b', 172, 2], ['b', 173, 1], ['c', 172.5, 4, 2, 1, 0],

    ['g', 190, 193, 3], ['c', 190.6, 4.3, 3, 0.9, 0], ['w', 194, 201, 1], ['k', 202, 1],
    ['sec', 206, 'Final Climb'],
    ['p', 207.5, 210.5, 3.6], ['p', 211.5, 214.5, 6], ['c', 212, 7.2, 3, 1, 0],

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);

const rid = n => { let s = ''; const a = 'abcdefghijkmnpqrstuvwxyz23456789'; for (let i = 0; i < n; i++) s += a[Math.random() * a.length | 0]; return s; };
const newCode = () => { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.random() * CODE_CHARS.length | 0]; return s; };
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const LOG = []; const dbg = x => { LOG.push(Math.round(now()) + ' ' + x); if (LOG.length > 300) LOG.shift(); };
const netStats = { pub: { s: 0, p: 0, a: 0 }, recv: 0, recvUniq: 0, since: now() };

/* ================= MINIMAL MQTT 3.1.1 OVER WEBSOCKET (QoS 0) ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
const mqStr = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
function mqPacket(type, body) { let len = body.length; const h = [type]; do { let d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; h.push(d); } while (len > 0); return new Uint8Array(h.concat(body)); }
class Broker {
  constructor(cfg, onMsg, onChange) { Object.assign(this, { cfg, url: cfg.url, onMsg, onChange, ready: false, subs: [], retry: 500 }); setTimeout(() => this.connect(), Math.random() * 300); }
  connect() {
    clearTimeout(this.rt); if (this.ws) { this.ws.onclose = null; try { this.ws.close(); } catch (e) {} }
    this.ready = false; this.buf = new Uint8Array(0);

    ws.onerror = () => {};

  }
  later() { this.rt = setTimeout(() => this.connect(), this.retry + Math.random() * 300); this.retry = Math.min(this.retry * 2, 8000); }

  }
  packet(h, p) {
    const type = h >> 4;
    if (type === 2) {
      if (p[1] !== 0) { dbg('refused ' + p[1]); this.ws.close(); return; }
      dbg('up ' + this.url); this.ready = true; this.retry = 500;
      this.subs.forEach(s => this.sendSub(s));
      this.ping = setInterval(() => this.send(new Uint8Array([0xC0, 0])), 15000);

    }
  }

  subscribe(t) { this.subs.push(t); if (this.ready) this.sendSub(t); }
  publish(t, obj, retain) { return this.send(mqPacket(0x30 | (retain ? 1 : 0), mqStr(t).concat(Array.from(enc.encode(JSON.stringify(obj)))))); }
}
const Net = {
  list: [],
  start(onMsg) { if (!this.list.length) BROKERS.forEach(c => this.list.push(new Broker(c, onMsg, () => this.changed()))); },
  up() { return this.list.some(b => b.ready); },
  subscribe(t) { this.list.forEach(b => b.subscribe(t)); },
  publish(t, o, r) { let ok = false; this.list.forEach(b => { if (b.publish(t, o, r)) ok = true; }); return ok; },
  kick() { this.list.forEach(b => { if (!b.ready && (!b.ws || b.ws.readyState > 1)) { b.retry = 500; b.connect(); } }); },
  changed() { if (this.up()) { if (!ui.upAt) ui.upAt = Date.now(); onNetUp(); } updateStatus(); }

/* ================= LEVEL COMPILE ================= */
function compileLevel(def) {
  const L = { name: def.name, solids: [], slopes: [], coins: [], enemies: [], cps: [], power: [], flag: null, secs: [], end: 240 };
  for (const e of def.data) {
    const [t, a, b, c, d, f] = e;
    if (t === 'g') L.solids.push({ x0: a, x1: b, y0: -12, y1: c, kind: 'g' });
    else if (t === 'p') L.solids.push({ x0: a, x1: b, y0: c - 0.6, y1: c, kind: 'p' });
    else if (t === 'b') L.solids.push({ x0: a, x1: a + 1, y0: b, y1: b + 1, kind: 'b' });
    else if (t === 's') { L.slopes.push({ x0: a, y0: b, x1: c, y1: d }); L.solids.push({ x0: a, x1: c, y0: -12, y1: Math.min(b, d) - 0.02, kind: 'hid' }); }
    else if (t === 'c') for (let i = 0; i < (c || 1); i++) L.coins.push({ x: a + i * (d || 0), y: b + i * (f || 0) });
    else if (t === 'w') L.enemies.push({ type: 'w', x0: a, x1: b, y: c, phase: L.enemies.length * 1.7 });
    else if (t === 'j') L.enemies.push({ type: 'j', x: a, y: b, phase: L.enemies.length * 0.53 });
    else if (t === 'k') L.cps.push({ x: a, y: b });
    else if (t === 'u') L.power.push({ x: a, y: b });
    else if (t === 'f') L.flag = { x: a, y: b };
    else if (t === 'sec') L.secs.push({ x: a, name: b });
    else if (t === 'end') L.end = a;
  }
  return L;
}
const LV = compileLevel(LEVELS[0]);
function enemyPos(e, tMs) { // deterministic from the host game clock -> no enemy traffic needed
  const t = Math.max(0, tMs) / 1000;
  if (e.type === 'w') {
    const L = e.x1 - e.x0 - 0.9, s = (t * 2.2 + e.phase) % (2 * L), o = s < L ? s : 2 * L - s;
    return { x: e.x0 + 0.45 + o, y: e.y, face: s < L ? 1 : -1, hop: -1, ph: 0 };
  }
  const ph = ((t + e.phase) % 1.9) / 1.9, u = ph / 0.55;
  return { x: e.x, y: e.y + (ph < 0.55 ? 2.2 * 4 * u * (1 - u) : 0), face: -1, hop: ph < 0.55 ? u : -1, ph };
}

/* ================= PLAYER PHYSICS (2D plane) ================= */
const PH = { G_UP: 38, G_DOWN: 70, G_CUT: 95, JUMP_V: 15.2, DJ_V: 13.5, TERM: -24, RUN: 8.5, RUN_MAX: 12.5, BOOST_T: 1.1,
  ACC: 36, AIR_ACC: 19, FRIC: 32, SKID: 72, OVER_DECAY: 3, SLOPE_G: 24, COYOTE: 0.1, BUFFER: 0.12, W: 0.72, H: 1.35, STEP: 1 / 120 };
function newBody(x, y) { return { x, y, vx: 0, vy: 0, face: 1, onGround: false, wasGround: false, coyote: 0, buffer: 0, prevJ: false, jumping: false, runT: 0, slope: null, slopeVy: 0, usedDJ: false, hasDJ: false, land: 0, skidT: 0, ev: [] }; }
const overlapY = (p, s) => p.y < s.y1 - 0.001 && p.y + PH.H > s.y0 + 0.001;
const overlapX = (p, s) => p.x + PH.W / 2 > s.x0 + 0.001 && p.x - PH.W / 2 < s.x1 - 0.001;
function stepPlayer(p, inp, dt, world) {
  const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0), jp = inp.j && !p.prevJ; p.prevJ = inp.j;
  p.coyote = p.onGround ? PH.COYOTE : p.coyote - dt;
  p.buffer = jp ? PH.BUFFER : p.buffer - dt;
  if (dir) p.face = dir;
  // momentum: holding a direction at speed on the ground slowly raises top speed
  if (p.onGround) { if (dir && dir === Math.sign(p.vx) && Math.abs(p.vx) > PH.RUN * 0.85) p.runT += dt; else if (!dir || dir !== Math.sign(p.vx)) p.runT = Math.max(0, p.runT - dt * 3); }
  const top = PH.RUN + (PH.RUN_MAX - PH.RUN) * Math.min(1, p.runT / PH.BOOST_T);
  if (p.onGround) {
    if (!dir) { const f = PH.FRIC * dt * (p.slope ? 0.5 : 1); p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; }
    else if (dir * p.vx < 0) { p.vx += dir * PH.SKID * dt; if (Math.abs(p.vx) > 4 && !p.skidT) { p.ev.push('skid'); p.skidT = 0.15; } }
    else if (Math.abs(p.vx) < top) p.vx = dir * Math.min(top, Math.abs(p.vx) + PH.ACC * dt);
    else p.vx -= Math.sign(p.vx) * PH.OVER_DECAY * dt; // overspeed (e.g. from a slope) bleeds off slowly
    if (p.slope) { const s = (p.slope.y1 - p.slope.y0) / (p.slope.x1 - p.slope.x0); p.vx -= PH.SLOPE_G * s / Math.sqrt(1 + s * s) * dt; }
  } else { // lighter air control that never kills momentum
    const cap = Math.max(top, Math.abs(p.vx));
    if (dir) p.vx = clamp(p.vx + dir * PH.AIR_ACC * dt, -cap, cap); else p.vx *= (1 - 0.6 * dt);
  }
  p.skidT = Math.max(0, p.skidT - dt);
  // jumps: buffered + coyote time, optional double jump
  if (p.buffer > 0 && p.coyote > 0) {

  let i = s.length - 1; while (i > 0 && s[i - 1].t > T) i--;
  const b = s[i], a = s[i - 1]; let o;
  if (a && a.t <= T && b.t >= T && b.t > a.t && Math.abs(b.x - a.x) < 6) { const k = (T - a.t) / (b.t - a.t); o = Object.assign({}, b, { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), vx: lerp(a.vx, b.vx, k), vy: lerp(a.vy, b.vy, k) }); }
  else { const last = T < s[0].t ? s[0] : s[s.length - 1], ex = clamp((T - last.t) / 1000, 0, 0.15); o = Object.assign({}, last, { x: last.x + last.vx * ex, y: last.y + (last.anim === 2 || last.anim === 3 ? last.vy * ex : 0) }); }
  const c = r.cur;
  if (c) {
    if (o.anim === 2 && c.anim !== 2) burst(o.x, o.y + 0.05, 7, '#efe3cc', 3, 1, 0.12, 0.4, 6);
    if ((c.anim === 2 || c.anim === 3) && o.anim <= 1) { o.land = 1; burst(o.x, o.y + 0.05, 6, '#efe3cc', 3, 0.8, 0.12, 0.4, 6); }
    if (c.alive && !o.alive) burst(c.x, Math.max(c.y, -3) + 0.7, 22, '#ffffff', 6, 4, 0.18, 0.8);
    if (!o.land) o.land = Math.max(0, (c.land || 0) - 0.08);
  }
  return (r.cur = o);
}

/* ---------- camera: average of living players + lead, zooms out when spread ---------- */
function updateCamera(dt) {
  const pts = [];
  if (game.playing && game.L) {
    if (game.L.alive) pts.push(game.L);
    for (const id in game.remotes) { const r = game.remotes[id], c = r.cur; if (c && c.alive && now() - r.last < 4000 && W.players.some(p => p.id === id)) pts.push(c); }
  }
  const cam = game.cam, asp = camera.aspect, tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), minW = asp > 1 ? 20 : 12;
  let tx, ty, tw;
  if (pts.length) {
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, avx = 0;
    for (const p of pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); avx += p.vx / pts.length; }
    tx = (minX + maxX) / 2 + clamp(avx * 0.35, -3.5, 3.5); ty = (minY + maxY) / 2 + 2.2;
    tw = Math.max(minW, maxX - minX + 10, (maxY - minY + 7) * asp);
  } else if (game.playing && game.L) { tx = game.L.x; ty = Math.max(game.L.y, 0) + 2.2; tw = minW; }
  else { tx = 7 + Math.sin(now() / 4000) * 2.5; ty = 2.6; tw = asp > 1 ? 18 : 10; }
  const d = clamp((Math.min(tw, 46) / 2) / (tanH * asp), 10, 75);
  cam.x = lerp(cam.x, tx, Math.min(1, dt * 3.2)); cam.y = lerp(cam.y, Math.max(ty, 1.5), Math.min(1, dt * 2.4)); cam.d = lerp(cam.d, d, Math.min(1, dt * 1.6));
  camera.position.set(cam.x, cam.y + cam.d * 0.12, cam.d); camera.lookAt(cam.x, cam.y, 0);
  sun.position.set(cam.x - 14, cam.y + 26, 22); sun.target.position.set(cam.x, cam.y - 2, 0);
  for (const p of parallax) { p.g.position.x = cam.x * p.factor; p.g.position.y = cam.y * p.factor * 0.5; }
}
function updateWorldView() {
  const t = gameTime(), T = now() / 1000, inPlay = W && W.gid && (W.phase === 'play' || W.phase === 'results');
  coinMeshes.forEach((m, i) => { m.visible = !(inPlay && (W.coins[i] != null || game.localCoins[i])); m.rotation.y = T * 3 + i * 0.4; m.position.y = LV.coins[i].y + Math.sin(T * 2.5 + i) * 0.08; });
  LV.enemies.forEach((e, i) => {
    const o = enemyObjs[i], b = o.userData.body, dead = inPlay && (W.dead[i] != null || game.localStomp[i]);
    if (dead) { if (!o.userData.deadAt) o.userData.deadAt = now(); const k = (now() - o.userData.deadAt) / 350; b.scale.set(1 + k * 0.5, Math.max(0.05, 1 - k), 1 + k * 0.5); o.visible = k < 1; return; }
    const ep = enemyPos(e, inPlay ? t : now());
    o.userData.deadAt = 0; o.visible = true; o.position.set(ep.x, ep.y, 0); b.rotation.y = ep.face > 0 ? 0.6 : -0.6;
    if (e.type === 'w') { b.rotation.z = Math.sin(T * 12 + i) * 0.08; b.position.y = Math.abs(Math.sin(T * 12 + i)) * 0.05; }
    else { const sq = ep.hop >= 0 ? 1 + 0.18 * Math.sin(ep.hop * Math.PI) : 1 - 0.28 * Math.max(0, Math.sin((ep.ph - 0.55) / 0.45 * Math.PI)); b.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq)); }
  });
  cpObjs.forEach((g, i) => { const on = inPlay && i <= W.cp; g.userData.flag.material = on ? mat('#4be37a', { emissive: '#1d8a3f', emissiveIntensity: 0.6 }) : mat('#9aa3b8'); g.userData.flag.position.y = lerp(g.userData.flag.position.y, on ? 2.3 : 0.9, 0.1); });
  powerObjs.forEach((g, i) => { g.rotation.y = T * 2; g.position.y = LV.power[i].y + Math.sin(T * 3) * 0.15; g.visible = !(game.playing && game.L && game.L.hasDJ); });
  if (flagObj) { const pos = flagObj.userData.cloth.geometry.attributes.position; for (let i = 0; i < pos.count; i++) { const x = pos.getX(i); pos.setZ(i, Math.sin(x * 2.2 - T * 6) * 0.2 * (x / 2.4)); } pos.needsUpdate = true; }
}

/* ================= HUD & UI ================= */
const fmtTime = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function updateHUD() {
  const show = !!(W && W.phase === 'play' && inRoom());
  $('hud').style.display = show ? 'flex' : 'none'; $('touch').style.display = show && isTouch ? 'block' : 'none';
  if (!show) { if ($('msg').innerHTML) $('msg').innerHTML = ''; return; }
  const t = gameTime();
  const hl = `<span>&#11088; ${W.score}</span><span>&#129689; ${Object.keys(W.coins).length}/${LV.coins.length}</span><span>&#10084;&#65039; ${W.lives}</span><span>&#9201; ${fmtTime(t)}</span>`;
  if ($('hudl').innerHTML !== hl) $('hudl').innerHTML = hl;
  const pl = W.players.map(p => { const icon = W.fin[p.id] != null ? ' &#127937;' : W.out[p.id] ? ' &#10006;' : W.resp[p.id] > t ? ' &#128128;' : ''; return `<span class="chip" style="${p.on ? '' : 'opacity:.5'}"><span class="dot" style="width:12px;height:12px;background:${COLORS[p.slot]}"></span>${esc(p.name)}${icon}</span>`; }).join('');
  if ($('plist').innerHTML !== pl) $('plist').innerHTML = pl;
  let msg = '';
  if (t < 0) msg = `<div style="font-size:64px">${Math.ceil(-t / 1000)}</div>`;
  else if (t < 900) msg = '<div style="font-size:56px;color:#ffd23f">GO!</div>';
  if (game.L && !game.L.alive) msg = W.out[me.id] ? 'Out of lives \u2013 cheer on your squad!' : W.resp[me.id] != null && (W.st[me.id] || {}).d >= game.deathN ? `Respawning in ${Math.max(0, Math.ceil((W.resp[me.id] - t) / 1000))}\u2026` : 'Ouch!';
  if (game.finished) msg = '<div style="color:#ffd23f">You made it! &#127881;</div>';
  if (W.cdEnd) { const who = W.players.filter(p => W.fin[p.id] != null).map(p => esc(p.name)).join(', '); msg += `<div style="font-size:17px;margin-top:6px" id="countdown">&#127937; ${who} reached the flag! ${Math.max(0, Math.ceil((W.cdEnd - t) / 1000))}s left</div>`; }
  if ($('msg').innerHTML !== msg) $('msg').innerHTML = msg;
  if (game.L && t > 0) { const si = sectionIdx(game.L.x); if (si !== game.secShown) { game.secShown = si; banner(LV.secs[si].name, 1800); } }
}
function updateStatus() {
  const el = $('status'); let msg = '', cls = '';
  if (sess) {
    if (!Net.up()) { msg = ui.upAt ? 'Reconnecting\u2026' : 'Connecting\u2026'; cls = 'warn'; }
    else if (!H && !W) { msg = 'Looking for room ' + sess.code + '\u2026'; cls = 'ok'; }
    else if (!H && W && Date.now() - ui.lastState > HOST_TIMEOUT) { msg = 'Host left or is not responding\u2026 waiting for them'; cls = 'err'; }
    else if (!H && W && !inRoom()) { msg = 'Joining\u2026'; cls = 'ok'; }
  }
  if (el.textContent !== msg) el.textContent = msg; el.className = msg ? 'show ' + cls : '';
}
const playerRow = p => `<li><span class="dot" style="background:${COLORS[p.slot]}"></span><span style="flex:1">${esc(p.name)} ${p.id === W.host ? '<span class="tag">host</span>' : ''} ${p.id === me.id ? '<span class="tag">you</span>' : ''} ${p.on ? '' : '<span class="tag">offline</span>'}</span><span class="small">${COLOR_NAMES[p.slot]}</span></li>`;
const inviteLink = () => location.origin + location.pathname + '?room=' + W.code;
function renderUI(force) {
  const view = !sess ? 'home' : !W || !inRoom() ? 'connect' : W.phase;
  const key = view + '|' + (view === 'play' ? '' : W ? W.v : '') + '|' + ui.err;
  if (!force && key === ui.view) return; ui.view = key;
  const room = (QS.get('room') || '').toUpperCase(); let html = '';
  if (view === 'home') html = `<div class="ov"><div class="panel"><h1>Dash <i>Squad</i></h1><p class="sub">Co-op 3D platformer for 1\u20134 players.<br>Run fast, jump precise, reach the flag together.</p>
    ${ui.err ? `<div class="err-box" id="err">${esc(ui.err)}</div>` : ''}
    <label for="name">Your name</label><input id="name" maxlength="14" autocomplete="nickname" placeholder="e.g. Sam" value="${esc(me.name)}">
    <button id="create" data-act="create">Create Room</button>
    <label for="code" style="margin-top:14px">Have a code?</label><div class="row"><input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.3em;font-weight:800" value="${esc(room)}"><button id="join" class="alt" data-act="join" style="margin:0;flex:0 0 38%">Join</button></div>
    <p class="small center" style="margin-top:12px">Keys: &larr; &rarr; / A D run \u00b7 Space / &uarr; jump. Phones get touch buttons.</p></div></div>`;
  else if (view === 'connect') html = `<div class="ov"><div class="panel center"><h1>Dash <i>Squad</i></h1><p>Connecting to room <b>${esc(sess.code)}</b>\u2026</p><button class="ghost" data-act="leave">Cancel</button></div></div>`;
  else if (view === 'lobby') {
    const n = W.players.length;
    html = `<div class="ov"><div class="panel two"><h1>Dash <i>Squad</i></h1><div><div class="center small">Room code</div><div class="code" id="roomcode">${esc(W.code)}</div>
      <div class="row"><button data-act="copy">Copy code</button><button class="alt" data-act="share">Share link</button></div>
      <div class="small center" style="margin-top:6px;word-break:break-all">${esc(inviteLink())}</div></div>
      <div><h2 id="pcount">Squad (${n}/${MAX_PLAYERS})</h2><ul class="plist">${W.players.map(playerRow).join('')}</ul>
      ${H ? `<button id="start" data-act="start">Start level${n === 1 ? ' (solo)' : ''}</button>` : '<div class="center small" id="waiting" style="padding:12px">Waiting for host to start\u2026</div>'}
      <button class="ghost" data-act="leave">Leave room</button></div></div></div>`;
  } else if (view === 'results' && W.result) {
    const r = W.result;
    html = `<div class="ov"><div class="panel two" id="results"><h1>${r.ok ? 'Level <i>Clear!</i>' : 'Game <i>Over</i>'}</h1><div><p class="sub">${esc(LV.name)} \u00b7 ${esc(r.why)}</p>
      <div class="big" id="total">${r.total}</div><div class="center small">team score \u00b7 time <b id="rtime">${fmtTime(r.t)}</b> \u00b7 lives left ${W.lives}</div><p class="small center">coin ${PTS.coin} \u00b7 stomp ${PTS.stomp} \u00b7 reaching the flag ${PTS.finish}</p></div><div>
      <table class="res" id="rtable"><tr class="small"><th></th><th style="text-align:left">Player</th><th>Coins</th><th>Stomps</th><th>Falls</th><th>Flag</th></tr>
      ${r.rows.map(x => `<tr data-pid="${esc(x.id)}"><td><span class="dot" style="display:inline-block;background:${COLORS[x.slot]}"></span></td><td style="text-align:left">${esc(x.name)}</td><td class="rc">${x.c}</td><td class="rs">${x.s}</td><td class="rd">${x.d}</td><td>${x.fin ? '&#127937;' : '\u2013'}</td></tr>`).join('')}</table>
      ${H ? '<button id="again" data-act="again">Play again (back to lobby)</button>' : '<p class="center small" id="waitagain">Waiting for host\u2026</p>'}
      <button class="ghost" data-act="leave">Leave room</button></div></div></div>`;
  }
  $('ui').innerHTML = html;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act;
  if (act === 'create' || act === 'join') {
    const n = ($('name').value || '').trim().slice(0, 14); if (!n) { ui.err = 'Please enter your name first.'; return renderUI(true); }
    me.name = n; save('ds_me', me); beep(1, 0.01, 'sine', 0.0001); // unlock audio on a user gesture
    if (act === 'create') return hostCreate();
    const c = ($('code').value || '').trim().toUpperCase().replace(/[^A-Z]/g, ''); if (c.length !== 4) { ui.err = 'Room codes are 4 letters.'; return renderUI(true); }
    return enterRoom(c, false);
  }
  if (act === 'leave') return leave();
  if (act === 'copy') return copyText(W.code);
  if (act === 'share') { const l = inviteLink(); if (navigator.share) navigator.share({ title: 'Dash Squad', text: 'Join my Dash Squad room ' + W.code, url: l }).catch(() => {}); else copyText(l); return; }
  if (act === 'start') return hostStart();
  if (act === 'again') return hostToLobby();
});

/* ================= MAIN LOOP ================= */
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const lobbySnap = a => ({ x: 5 + a.slot * 1.5, y: 0, vx: 0, vy: 0, face: 1, anim: W && W.phase === 'results' ? 5 : 0, alive: true });
let lastT = now(), fpsAcc = 0, fpsN = 0;
function frame() {
  requestAnimationFrame(frame);
  const tn = now(), dt = Math.min(0.1, (tn - lastT) / 1000); lastT = tn;
  fpsAcc += dt; fpsN++; if (fpsAcc >= 1) { game.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  const playing = game.playing && W && W.phase === 'play';
  if (playing) {
    updateLocal(dt);
    if (tn - game.lastPosSave > 1000 && game.L && game.L.alive) { game.lastPosSave = tn; save('ds_pos', { gid: W.gid, code: W.code, x: game.L.x, y: game.L.y, dj: game.L.hasDJ }); }
  }
  for (const id in game.avatars) {
    const a = game.avatars[id]; let s;
    if (!playing) s = lobbySnap(a);
    else if (id === me.id) s = localSnapshot();
    else { const r = game.remotes[id]; s = r && now() - r.last < 5000 ? sampleRemote(r) : null; if (!s) s = { x: 0, y: 0, alive: false }; }
    poseAvatar(a, s, dt);
  }
  updateWorldView(); updateParticles(dt); updateCamera(dt); updateHUD();
  renderer.render(scene, camera);
}
setInterval(() => { if (game.playing && W && W.phase === 'play') publishLocal(); }, 1000 / SEND_HZ); // own timer: steady 10 Hz even if FPS dips
setInterval(() => {
  if (H) { if (hostCheck()) hostChanged(); else if (Date.now() - (H.lastPub || 0) > 1000) hostPublish(); } // 1 Hz heartbeat
  else if (sess && inRoom() && Date.now() - ui.lastHi > 3000) { ui.lastHi = Date.now(); sendAction({ type: 'hi' }); }
  if (!H && ui.pending.length && Date.now() - ui.lastResend > 1000) { ui.lastResend = Date.now(); resendPending(); }
  if (sess && !H && !W && Net.up() && Date.now() - Math.max(ui.joinStart, ui.upAt || 0) > NOT_FOUND_MS) fail('Room \u201c' + sess.code + '\u201d not found. Check the code and try again.');
  updateStatus();
}, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden && sess) { Net.kick(); if (H) hostPublish(); } });
addEventListener('online', () => { if (sess) Net.kick(); });

/* ================= TEST HOOK (only used by the automated tests) ================= */
window.__test = {
  get: () => ({ phase: W && W.phase, me: me.id, L: game.L && { x: game.L.x, y: game.L.y, vx: game.L.vx, vy: game.L.vy, alive: game.L.alive, onGround: game.L.onGround, hasDJ: game.L.hasDJ }, finished: game.finished, localStomp0: !!game.localStomp[0], W, fps: game.fps, net: netStats, log: LOG.slice(-40),
    remotes: Object.fromEntries(Object.entries(game.remotes).map(([k, r]) => [k, r.cur && { x: r.cur.x, y: r.cur.y, alive: r.cur.alive, age: Math.round(now() - r.last) }])) }),
  input(o) { Object.assign(testInput, o, { on: true }); }, release() { Object.assign(testInput, { l: false, r: false, j: false, on: false }); },
  av: () => Object.entries(game.avatars).map(([id, a]) => ({ id, g: a.g.visible, rig: a.rig.visible, x: +a.g.position.x.toFixed(2), y: +a.g.position.y.toFixed(2), sx: +a.body.scale.x.toFixed(2), sy: +a.body.scale.y.toFixed(2), inv: game.L && game.L.inv })),
  teleport(x, y, vx = 0, vy = 0) { game.noWarp = now() + 1500; game.noHurt = now() + 1200; Object.assign(game.L, { x, y, vx, vy, onGround: false }); }, // test-only grace (no blink) so warps don't land on enemies
  level: LV, enemyPos: i => enemyPos(LV.enemies[i], gameTime()), gameTime, PH,
  sim(o) { // run the real physics offline in a custom mini-world, returns the trajectory
    const world = { solids: o.solids || [], slopes: o.slopes || [], end: 1e9 }, p = newBody(o.x || 0, o.y || 0); Object.assign(p, o.body || {});
    const out = []; for (let f = 0; f < o.frames; f++) { stepPlayer(p, o.input(f, p), PH.STEP, world); out.push({ f, x: p.x, y: p.y, vx: p.vx, vy: p.vy, g: p.onGround }); p.ev.length = 0; }
    return out;
  }
};

/* ================= BOOT ================= */
buildLevel(); frame();
{
  const room = (QS.get('room') || '').toUpperCase();
  if (sess && (!room || room === sess.code)) {
    const h = sess.host && load('ds_host_' + sess.code);
    if (h) { H = h; H.v += 2; H.players.forEach(p => { if (p.id !== me.id) p.seen = Date.now(); }); Net.start(onMessage); Net.subscribe(TOPIC + sess.code + '/+'); ui.joinStart = Date.now(); hostChanged(); }
    else if (sess.host) { save('ds_session', null); sess = null; ui.err = 'Your old room has ended.'; renderUI(true); }
    else enterRoom(sess.code, false);
  } else { sess = null; renderUI(true); }
}
